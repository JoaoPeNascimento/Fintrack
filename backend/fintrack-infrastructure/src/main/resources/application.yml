server:
  port: ${PORT:8080}

spring:
  application:
    name: fintrack-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/fintrack}

fintrack:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  jwt:
    secret: ${BACKEND_JWT_SECRET:}
    issuer: fintrack-web
    audience: fintrack-api

management:
  endpoints:
    web:
      exposure:
        include: health
