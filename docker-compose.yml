# Ambiente local: MongoDB + backend Spring Boot. O front roda com `npm run dev` dentro de frontend/.
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/fintrack
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:?defina BACKEND_JWT_SECRET (min. 32 caracteres)}
      APP_TIMEZONE: America/Sao_Paulo

volumes:
  mongo-data:
