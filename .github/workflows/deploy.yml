name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Backend - testes (unitários, ArchUnit e integração com Mongo via Testcontainers)
        working-directory: backend
        run: ./mvnw -B verify

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Acessando a EC2 e atualizando a aplicação
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/app
            git pull origin main
            cd backend
            ./mvnw -q -B -DskipTests package
            sudo systemctl restart fintrack-backend
            cd ../frontend
            npm install
            npm run build
            pm2 restart gerenciador-financeiro
